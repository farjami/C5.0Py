[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "c5own"
version = "0.1.0"
description = "Readable C4.5/C5.0-style decision tree with class weights, misclassification-cost matrix and feature (test) costs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]
